<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foldable Sim demo</title>
  <style>
    :root { color-scheme: dark; --fold-y: 0px; --fold-h: 0px; --fold-x: 0px; --fold-w: 0px; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #101014; color: #ececf1; }
    .app { height: 100%; display: grid; gap: 8px; padding: 8px; grid-template: "a" 1fr "b" 1fr / 1fr; }
    .pane { border-radius: 14px; padding: 16px; overflow: auto; background: #1b1b23; box-shadow: inset 0 0 0 1px #2b2b36; }
    .pane h2 { margin: 0 0 8px; font-size: 15px; }
    .pane p, .pane pre { margin: 0 0 8px; font-size: 13px; color: #a9a9b8; }
    .a { grid-area: a; background: linear-gradient(135deg, #12343a, #1b1b23); }
    .b { grid-area: b; }
    /* Closed or flat: one pane fills the screen. */
    html:not([data-hinge="partial"]) .app { grid-template: "a" 1fr / 1fr; }
    html:not([data-hinge="partial"]) .b { display: none; }
    /* Half open, horizontal crease (a laptop): the panes meet exactly at the hinge. */
    html[data-hinge="partial"][data-fold="horizontal"] .app { padding: 0; row-gap: var(--fold-h); grid-template: "a" var(--fold-y) "b" 1fr / 1fr; }
    /* Half open, vertical crease (a book). */
    html[data-hinge="partial"][data-fold="vertical"] .app { padding: 0; column-gap: var(--fold-w); grid-template: "a b" 1fr / var(--fold-x) 1fr; }
  </style>
</head>
<body>
  <div class="app">
    <section class="pane a">
      <h2>Canvas</h2>
      <p>This pane is the app's main surface. Half open, it ends exactly at the crease.</p>
      <pre id="state">waiting for the simulator…</pre>
    </section>
    <section class="pane b">
      <h2>Controls</h2>
      <p>Shown only while the device is half open, on the far side of the hinge.</p>
      <p id="segments"></p>
    </section>
  </div>
  <script type="module">
    import { installFoldablePosture } from '../client/foldable-posture.js'
    installFoldablePosture({
      onChange: p => {
        document.getElementById('state').textContent = JSON.stringify({ hinge: p.hinge, fold: p.fold, crease: p.crease }, null, 2)
        const segs = window.viewport?.segments ?? []
        document.getElementById('segments').textContent = `viewport.segments: ${segs.length} (${segs.map(s => `${s.width}×${s.height}`).join(', ')})`
      },
    })
  </script>
</body>
</html>
